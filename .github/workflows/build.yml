name: Build Ultimate Enchanting

on:
  workflow_dispatch:
  push:
    branches: [ main, master, 'feature/ultimate-enchanting-2.0' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build mod
        run: gradle --no-daemon build
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-enchanting-jar
          path: build/libs/*.jar
          if-no-files-found: error
